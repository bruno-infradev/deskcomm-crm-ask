name: Imagem ASK (fork)
on:
  push:
    branches: ["ask-*"]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=v1.104.0
          tags: |
            ghcr.io/bruno-infradev/deskcommcrm-ask:${{ github.sha }}
            ghcr.io/bruno-infradev/deskcommcrm-ask:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
